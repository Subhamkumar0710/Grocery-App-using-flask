<div class="container my-4">
    <form class="row g-2 align-items-center">
        <!-- Parameter Dropdown -->
        <div class="col-md-3 col-sm-6">
            <select name="parameter" id="parameter" class="form-select shadow-sm">
                {% for param in parameters %}
                {% if param == parameter %}
                <option value="{{ param }}" selected>{{ parameters[param] }}</option>
                {% else %}
                <option value="{{ param }}">{{ parameters[param] }}</option>
                {% endif %}
                {% endfor %}
            </select>
        </div>

        <!-- Search Query -->
        <div class="col-md-5 col-sm-6">
            <div class="input-group shadow-sm">
                <span class="input-group-text bg-light">
                    <i class="fas fa-search text-secondary"></i>
                </span>
                <input type="text" class="form-control" id="query" name="query" placeholder="Search for products..."
                    value="{{ query }}">
            </div>
        </div>

        <!-- Buttons -->
        <div class="col-md-2 col-sm-6 d-grid">
            <button type="button" class="btn btn-outline-danger" onclick="clearsearch()">
                <i class="fas fa-times-circle me-1"></i> Clear
            </button>
        </div>
        <div class="col-md-2 col-sm-6 d-grid">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-search me-1"></i> Search
            </button>
        </div>
    </form>
</div>

<script>
    function clearsearch() {
        window.location.href = '/';
    }
</script>

<style>
    .form-select,
    .form-control,
    .btn {
        border-radius: 10px;
    }

    .btn {
        font-weight: 500;
    }
</style>
