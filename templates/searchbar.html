<div class="container-fluid" p-4>
    <form>
        <select name="parameter" id="parameter" class="form-select">
            {% for param in parameters %}
                {% if param== parameter %}
                    <option value="{{param}}" selected>{{parameter[param]}}</option>
                {% else %}
                    <option value="{{param}}">{{parameters[param]}}</option>
                {% endif %}  
            {% endfor %}
        </select>
        <input type="text" class="form-control" id="query" name="query" placeholder="Search Query" value="{{query}}">
        <button type="button" class="btn btn-outline-danger clear-button" onclick="clearsearch()">
            Clear
        </button>
        <button type="submit" class="btn btn-outline-primary search-button">
            <i class="fas fa-search"></i>
            Search
        </button>
    </form>
</div>

<style>
    form {
        width: 100%;
        display: flex;
        flex-direction: row;
        justify-content: space-evenly;
        align-items: center;
    }

    #parameter {
        margin-right: 10px;
        margin-left: 10px;
        width: 15%;
    }

    #search {
        margin-left: 10px;
        margin-right: 10px;
        width: 40%;
    }
    .search-button{
        margin-left: 10px;
        margin-right: 10px;
        width: 15%;
    }
    .clear-button{
        margin-left: 10px;
        width: 15%;
    }

</style>
<script>
    function clearsearch(){
        window.location.href = '/';
    }
</script>
