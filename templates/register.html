{% extends "layout.html" %}

{% block title %}
Register - S.K Grocery
{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg p-4" style="max-width: 450px; width: 100%; border-radius: 15px;">
        <div class="card-body">
            <h2 class="text-center text-success mb-4">
                <i class="fas fa-user-plus me-2"></i> Register
            </h2>
            <form method="post" class="needs-validation" novalidate>


                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Username</label>
                    <input type="text" name="username" id="username" class="form-control shadow-sm"
                        placeholder="Enter username" required>
                    <div class="invalid-feedback">Please enter a username.</div>
                </div>


                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" id="password" class="form-control shadow-sm"
                        placeholder="Enter password" required>
                    <div class="invalid-feedback">Please enter a password.</div>
                </div>


                <div class="mb-4">
                    <label for="name" class="form-label fw-semibold">Full Name</label>
                    <input type="text" name="name" id="name" class="form-control shadow-sm"
                        placeholder="Enter your name">
                </div>


                <button type="submit" class="btn btn-success w-100 py-2">
                    <i class="fas fa-check-circle me-1"></i> Register
                </button>

            </form>


            <p class="text-center mt-3 mb-0">
                Already have an account?
                <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold text-primary">Login here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block style %}
<style>
    body {
        background: linear-gradient(135deg, #d4fc79, #96e6a1);
    }
</style>
{% endblock %}
