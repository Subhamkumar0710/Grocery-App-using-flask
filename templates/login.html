{% extends "layout.html" %}

{% block title %}
Login - S.K Grocery
{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%; border-radius: 15px;">
        <div class="card-body">
            <h2 class="text-center text-success mb-4">
                <i class="fas fa-sign-in-alt me-2"></i> Login
            </h2>

            <form method="post" class="needs-validation" novalidate>

                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Username</label>
                    <input type="text" name="username" id="username" class="form-control shadow-sm"
                        placeholder="Enter username" required>
                    <div class="invalid-feedback">Please enter your username.</div>
                </div>


                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" id="password" class="form-control shadow-sm"
                        placeholder="Enter password" required>
                    <div class="invalid-feedback">Please enter your password.</div>
                </div>


                <button type="submit" class="btn btn-success w-100 py-2">
                    <i class="fas fa-lock me-1"></i> Login
                </button>
            </form>


            <p class="text-center mt-3 mb-0">
                Don’t have an account?
                <a href="{{ url_for('register') }}" class="text-decoration-none fw-semibold text-primary">Register
                    here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block style %}
<style>
    body {
        background: linear-gradient(135deg, #c3ecb2, #7ee8fa);
    }
</style>
{% endblock %}
